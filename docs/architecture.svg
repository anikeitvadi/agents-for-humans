<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A4652"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#F7F8F6"/>

  <text x="60" y="40" font-size="21" font-weight="700" fill="#10151B">Immigration Status Guardian · architecture</text>
  <text x="60" y="62" font-size="13" fill="#5B6773">One deterministic engine, two domain packs. The model works at three edges: extracting document fields, writing the intro of an attorney draft it cannot otherwise edit, and the guardian agent, whose only tools are the engine's checks.</text>

  <!-- USER SURFACE -->
  <rect x="60" y="84" width="1080" height="108" rx="10" fill="#FFFFFF" stroke="#3A4652" stroke-width="1.5"/>
  <text x="76" y="106" font-size="12" font-weight="700" fill="#3A4652" letter-spacing="0.6">USER SURFACE · ui/index.html, served by FastAPI (agent/app.py)</text>
  <rect x="76" y="118" width="330" height="60" rx="6" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="88" y="138" font-size="12.5" font-weight="600" fill="#10151B">Case review tab</text>
  <text x="88" y="155" font-size="11.5" fill="#3A4652">Two document dates side by side, the day gap between</text>
  <text x="88" y="170" font-size="11.5" fill="#3A4652">them, and a "Review attorney draft" side panel.</text>
  <rect x="422" y="118" width="330" height="60" rx="6" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="434" y="138" font-size="12.5" font-weight="600" fill="#10151B">Recall demo tab</text>
  <text x="434" y="155" font-size="11.5" fill="#3A4652">One seeded receipt matched against the live CPSC feed.</text>
  <text x="434" y="170" font-size="11.5" fill="#3A4652">One ping: refund or voucher. Labeled live vs. fallback.</text>
  <rect x="768" y="118" width="356" height="60" rx="6" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="780" y="138" font-size="12.5" font-weight="600" fill="#10151B">Status chip + activity feed</text>
  <text x="780" y="155" font-size="11.5" fill="#3A4652">"Needs review" or "No new notification". Demo controls</text>
  <text x="780" y="170" font-size="11.5" fill="#3A4652">simulate an upload or a scheduled poll firing.</text>

  <!-- API arrow -->
  <line x1="600" y1="192" x2="600" y2="232" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="612" y="216" font-size="11" fill="#5B6773">JSON over HTTP · /api/sample-case · /api/process-sample-case · /api/bulletin-poll · /api/recalls/check · /api/gate-demo</text>

  <!-- BUILT BAND -->
  <rect x="60" y="236" width="1080" height="440" rx="12" fill="none" stroke="#2E8C77" stroke-width="2"/>
  <rect x="76" y="226" width="318" height="20" fill="#F7F8F6"/>
  <text x="84" y="241" font-size="12" font-weight="700" fill="#2E8C77" letter-spacing="0.6">BUILT · runs locally · 123 tests pass with no AWS credentials</text>

  <!-- INPUTS -->
  <rect x="80" y="262" width="300" height="160" rx="8" fill="#FFFFFF" stroke="#8A97A3"/>
  <text x="94" y="283" font-size="12" font-weight="700" fill="#3A4652">INPUTS · fixtures/</text>
  <text x="94" y="304" font-size="11.5" fill="#10151B">• Document specimens: synthetic I-94, I-797,</text>
  <text x="104" y="319" font-size="11.5" fill="#10151B">passport PNGs (invented identity, real format)</text>
  <text x="94" y="340" font-size="11.5" fill="#10151B">• Visa Bulletin, Sep + Oct 2025 (EB2-India), paired</text>
  <text x="104" y="355" font-size="11.5" fill="#10151B">with the USCIS chart designation for each month</text>
  <text x="94" y="376" font-size="11.5" fill="#10151B">• CPSC SaferProducts API, live and unauthenticated,</text>
  <text x="104" y="391" font-size="11.5" fill="#10151B">with a captured real recall as the fallback</text>
  <text x="94" y="412" font-size="11.5" fill="#10151B">• One seeded receipt, one seeded bulletin case</text>

  <!-- EXTRACTION -->
  <rect x="80" y="446" width="300" height="130" rx="8" fill="#FFF8EA" stroke="#C99A3C"/>
  <text x="94" y="467" font-size="12" font-weight="700" fill="#8A6414">EXTRACTION · agent/llm/extract.py</text>
  <text x="94" y="488" font-size="11.5" fill="#10151B">Bedrock Converse, multimodal document blocks.</text>
  <text x="94" y="505" font-size="11.5" fill="#10151B">Every field carries evidence and a status:</text>
  <text x="94" y="520" font-size="11.5" fill="#10151B">extracted / missing / ambiguous. Anything unsure</text>
  <text x="94" y="535" font-size="11.5" fill="#10151B">forces needs_review; the rule never runs on it.</text>
  <text x="94" y="558" font-size="11" fill="#8A6414">mode: live (AWS creds present) or recorded (fixture replay)</text>

  <!-- ENGINE -->
  <rect x="410" y="262" width="390" height="314" rx="8" fill="#FFFFFF" stroke="#2E8C77" stroke-width="1.5"/>
  <text x="424" y="283" font-size="12" font-weight="700" fill="#2E8C77">DETERMINISTIC ENGINE · agent/engine/ · no model in this path</text>
  <rect x="424" y="296" width="362" height="34" rx="5" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="436" y="317" font-size="11.5" fill="#10151B"><tspan font-weight="600">schema.py</tspan>  validate the event and the extracted fields</text>
  <line x1="605" y1="330" x2="605" y2="344" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="424" y="346" width="362" height="62" rx="5" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="436" y="366" font-size="11.5" fill="#10151B"><tspan font-weight="600">packs/*/rules.py</tspan>  evaluate</text>
  <text x="436" y="382" font-size="11" fill="#3A4652">immigration: I-94 vs I-797 date gap (pure arithmetic); bulletin</text>
  <text x="436" y="397" font-size="11" fill="#3A4652">cutoff, only against the USCIS-designated chart. recalls: exact match.</text>
  <line x1="605" y1="408" x2="605" y2="422" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="424" y="424" width="362" height="62" rx="5" fill="#E6F4F0" stroke="#2E8C77"/>
  <text x="436" y="444" font-size="11.5" fill="#10151B"><tspan font-weight="600">decision_gate.py</tspan>  surface only if all four hold</text>
  <text x="436" y="460" font-size="11" fill="#3A4652">material · actionable · window still open · not already surfaced</text>
  <text x="436" y="475" font-size="11" fill="#3A4652">for this clock, event, and rule version. Otherwise: silent.</text>
  <line x1="605" y1="486" x2="605" y2="500" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="424" y="502" width="362" height="62" rx="5" fill="#EEF2F5" stroke="#C7D0D8"/>
  <text x="436" y="522" font-size="11.5" fill="#10151B"><tspan font-weight="600">store.py</tspan>  SQLite ledger: alerts + drafts</text>
  <text x="436" y="538" font-size="11" fill="#3A4652">UNIQUE(clock_id, event_id, rule_version): replay and restart safe.</text>
  <text x="436" y="553" font-size="11" fill="#3A4652">A "ready" draft is sticky; a surfaced alert is never downgraded.</text>

  <!-- DRAFTING -->
  <rect x="830" y="262" width="290" height="160" rx="8" fill="#FFF8EA" stroke="#C99A3C"/>
  <text x="844" y="283" font-size="12" font-weight="700" fill="#8A6414">STRANDS AGENTS · agent/llm/{draft,guardian}.py</text>
  <text x="844" y="304" font-size="11.5" fill="#10151B"><tspan font-weight="600">Drafting:</tspan> the agent writes only the intro of</text>
  <text x="844" y="319" font-size="11.5" fill="#10151B">the attorney message. The safety-boundary core</text>
  <text x="844" y="334" font-size="11.5" fill="#10151B">is fixed text it cannot edit; absent or failing,</text>
  <text x="844" y="349" font-size="11.5" fill="#10151B">the core ships alone.</text>
  <text x="844" y="370" font-size="11.5" fill="#10151B"><tspan font-weight="600">Guardian:</tspan> "Ask the guardian" / {"prompt"}.</text>
  <text x="844" y="385" font-size="11.5" fill="#10151B">Four tools, each a pack check on the same ledger.</text>
  <text x="844" y="400" font-size="11.5" fill="#10151B">It may only call a tool and report the result.</text>
  <text x="844" y="415" font-size="11" fill="#8A6414">Recall draft is deterministic remedy text, no model.</text>

  <!-- OUTPUT -->
  <rect x="830" y="446" width="290" height="130" rx="8" fill="#FFFFFF" stroke="#8A97A3"/>
  <text x="844" y="467" font-size="12" font-weight="700" fill="#3A4652">OUTCOMES back to the UI</text>
  <text x="844" y="488" font-size="11.5" fill="#10151B"><tspan font-weight="600" fill="#2E8C77">surfaced</tspan>  one ping, draft persisted</text>
  <text x="844" y="508" font-size="11.5" fill="#10151B"><tspan font-weight="600">silent</tspan>  ledger updated, no new ping; any</text>
  <text x="844" y="523" font-size="11.5" fill="#10151B">existing ready draft is returned unchanged</text>
  <text x="844" y="543" font-size="11.5" fill="#10151B"><tspan font-weight="600" fill="#8A6414">error</tspan>  extraction blocked, no date math run</text>
  <text x="844" y="563" font-size="11" fill="#5B6773">Every response carries mode: live | recorded | fallback</text>

  <!-- arrows inside built band -->
  <line x1="380" y1="342" x2="410" y2="342" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="383" y="336" font-size="9.5" fill="#5B6773">feeds</text>
  <line x1="230" y1="422" x2="230" y2="446" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="438" font-size="9.5" fill="#5B6773">document bytes</text>
  <line x1="380" y1="510" x2="410" y2="510" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="383" y="504" font-size="9.5" fill="#5B6773">fields</text>
  <line x1="800" y1="342" x2="830" y2="342" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="801" y="336" font-size="9.5" fill="#5B6773">surfaced</text>
  <line x1="975" y1="422" x2="975" y2="446" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="533" x2="830" y2="533" stroke="#3A4652" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="803" y="527" font-size="9.5" fill="#5B6773">silent</text>

  <!-- Packs footer -->
  <rect x="80" y="596" width="1040" height="62" rx="8" fill="#FFFFFF" stroke="#8A97A3"/>
  <text x="94" y="617" font-size="12" font-weight="700" fill="#3A4652">DOMAIN PACKS · agent/packs/ · same engine, same gate, same ledger</text>
  <text x="94" y="636" font-size="11.5" fill="#10151B"><tspan font-weight="600">immigration/</tspan>  rules.py · pipeline.py (sample case: extract → rule → gate → draft) · bulletin.py (unattended monthly poll off captured bulletins; Sep 2025 stays silent, Oct 2025 surfaces)</text>
  <text x="94" y="652" font-size="11.5" fill="#10151B"><tspan font-weight="600">recalls/</tspan>  rules.py · feed.py (live CPSC, captured fallback) · pipeline.py. Deliberately thin: it proves the engine is generic, it is not a second headline.</text>

  <!-- PRODUCTION PATH BAND -->
  <rect x="60" y="704" width="1080" height="170" rx="12" fill="none" stroke="#8A97A3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="76" y="694" width="400" height="20" fill="#F7F8F6"/>
  <text x="84" y="709" font-size="12" font-weight="700" fill="#5B6773" letter-spacing="0.6">PRODUCTION PATH · Runtime is built; the rest is design only</text>
  <rect x="80" y="728" width="245" height="128" rx="8" fill="#E6F4F0" stroke="#2E8C77" stroke-width="1.5"/>
  <text x="94" y="749" font-size="12" font-weight="700" fill="#2E8C77">AgentCore Runtime · DEPLOYED</text>
  <text x="94" y="769" font-size="11" fill="#3A4652">deploy/agentcore_entrypoint.py runs the</text>
  <text x="94" y="784" font-size="11" fill="#3A4652">same pipeline. Direct code deploy, logs</text>
  <text x="94" y="799" font-size="11" fill="#3A4652">and traces on. Invoked in the cloud:</text>
  <text x="94" y="814" font-size="11" fill="#3A4652">surfaced once, then silent on repeat.</text>
  <rect x="345" y="728" width="245" height="128" rx="8" fill="#FFFFFF" stroke="#C7D0D8" stroke-dasharray="4 3"/>
  <text x="359" y="749" font-size="12" font-weight="700" fill="#3A4652">Gateway + Scheduler</text>
  <text x="359" y="769" font-size="11" fill="#3A4652">Feeds (USCIS, Federal Register, DOS,</text>
  <text x="359" y="784" font-size="11" fill="#3A4652">CPSC) as MCP tools with brokered auth.</text>
  <text x="359" y="804" font-size="11" fill="#3A4652">EventBridge cron invokes the unattended</text>
  <text x="359" y="819" font-size="11" fill="#3A4652">polls that the demo buttons simulate today.</text>
  <rect x="610" y="728" width="245" height="128" rx="8" fill="#FFFFFF" stroke="#C7D0D8" stroke-dasharray="4 3"/>
  <text x="624" y="749" font-size="12" font-weight="700" fill="#3A4652">Memory + Identity</text>
  <text x="624" y="769" font-size="11" fill="#3A4652">Long-term: a user's clocks, documents,</text>
  <text x="624" y="784" font-size="11" fill="#3A4652">preferences, ping history.</text>
  <text x="624" y="804" font-size="11" fill="#3A4652">Cognito-issued JWT per user; today the</text>
  <text x="624" y="819" font-size="11" fill="#3A4652">demo is single-tenant on local SQLite.</text>
  <rect x="875" y="728" width="245" height="128" rx="8" fill="#FFFFFF" stroke="#C7D0D8" stroke-dasharray="4 3"/>
  <text x="889" y="749" font-size="12" font-weight="700" fill="#3A4652">Policy + Observability</text>
  <text x="889" y="769" font-size="11" fill="#3A4652">Cedar gates on any tool that drafts or</text>
  <text x="889" y="784" font-size="11" fill="#3A4652">sends on the user's behalf.</text>
  <text x="889" y="804" font-size="11" fill="#3A4652">OTEL traces to CloudWatch across the</text>
  <text x="889" y="819" font-size="11" fill="#3A4652">Runtime and Gateway.</text>
</svg>
